<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Demo — Artintele.ai</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
<link rel="apple-touch-icon" href="/assets/img/logo.svg">
<meta name="description" content="Book a consultation or schedule a demo. Our AI agents converse fluently across English, Kannada, Hindi, Tamil, Telugu, Malayalam and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Devanagari&family=Noto+Sans+Kannada&family=Noto+Sans+Tamil&family=Noto+Sans+Telugu&family=Noto+Sans+Malayalam&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem('artintele-theme')==='dark')?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
</head>
<body>
<div data-screen-label="Contact" style="position:relative;width:100%;min-height:100vh;">
  <canvas id="artintele-lang-canvas" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;"></canvas>
  <div style="position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(110% 80% at 50% 50%, rgba(var(--veil),0) 30%, rgba(var(--veil),0.55) 100%);"></div>

  <nav style="position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 32px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(to bottom, rgba(var(--surface),0.85), rgba(var(--surface),0.38));border-bottom:1px solid rgba(var(--border),0.16);">
    <a href="/" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:rgba(var(--head),1);">
      <img src="/assets/img/logo.svg" alt="Artintele" width="30" height="30" style="display:block;flex:none;">
      <span style="font-family:'Sora';font-weight:700;font-size:17px;letter-spacing:-0.02em;">artintele<span style="opacity:0.45;">.ai</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:22px;">
      <a class="nav-link" href="/#services" style="text-decoration:none;color:rgba(var(--text),0.78);font-size:14px;font-weight:500;white-space:nowrap;">Services</a>
      <a class="nav-link" href="/#voices" style="text-decoration:none;color:rgba(var(--text),0.78);font-size:14px;font-weight:500;white-space:nowrap;">AI Voices</a>
      <a class="nav-link" href="/#industries" style="text-decoration:none;color:rgba(var(--text),0.78);font-size:14px;font-weight:500;white-space:nowrap;">Industries</a>
      <a class="nav-link" href="/careers.html" style="text-decoration:none;color:rgba(var(--text),0.78);font-size:14px;font-weight:500;white-space:nowrap;">Careers</a>
      <a href="/contact.html" style="text-decoration:none;color:rgba(var(--head),1);font-size:14px;font-weight:600;">Contact</a>
      <button type="button" aria-label="Toggle dark mode" onclick="toggleTheme()" class="theme-toggle" style="flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(var(--border),0.32);background:rgba(var(--surface),0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(var(--head),1);position:relative;"><span id="artintele-theme-sun" style="position:absolute;display:flex;transition:opacity .3s ease,transform .4s ease;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"></path></svg></span><span id="artintele-theme-moon" style="position:absolute;display:flex;opacity:0;transform:rotate(-40deg);transition:opacity .3s ease,transform .4s ease;"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"></path></svg></span></button>
    </div>
  </nav>

  <section style="position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 40px 80px;">
    <h1 style="font-family:'Sora';font-weight:700;font-size:clamp(40px,6vw,84px);line-height:0.98;letter-spacing:-0.035em;margin:0;text-align:center;max-width:16ch;background:linear-gradient(135deg,var(--head-from),#1f9d5b);-webkit-background-clip:text;background-clip:text;color:transparent;">We speak your customers' language.</h1>
    <p style="margin:24px auto 0;font-size:18px;line-height:1.55;color:rgba(var(--text),0.72);max-width:52ch;text-align:center;">Book a consultation or schedule a demo. Our AI agents converse fluently across English, Kannada, Hindi, Tamil, Telugu, Malayalam and more.</p>

    <div style="width:100%;max-width:640px;margin-top:48px;position:relative;padding:38px;border-radius:24px;border:1px solid rgba(var(--border),0.24);background:linear-gradient(155deg,rgba(var(--surface),0.88),rgba(var(--surface),0.53));backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px);box-shadow:0 50px 120px -40px rgba(var(--shadow),0.24),inset 0 1px 0 rgba(var(--edge),0.9);">
      <form id="artintele-contact-form" style="display:flex;flex-direction:column;gap:18px;">
        <div class="ai-form-2" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
          <label style="display:flex;flex-direction:column;gap:9px;">
            <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">Name</span>
            <input name="name" type="text" required placeholder="Your name" style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;transition:border-color .2s;">
          </label>
          <label style="display:flex;flex-direction:column;gap:9px;">
            <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">Company</span>
            <input name="company" type="text" placeholder="Your business" style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;transition:border-color .2s;">
          </label>
        </div>
        <div class="ai-form-2" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
          <label style="display:flex;flex-direction:column;gap:9px;">
            <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">Email</span>
            <input name="email" type="email" required placeholder="you@email.com" style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;transition:border-color .2s;">
          </label>
          <label style="display:flex;flex-direction:column;gap:9px;">
            <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">Phone</span>
            <input name="phone" type="tel" placeholder="+91 90000 00000" style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;transition:border-color .2s;">
          </label>
        </div>
        <label style="display:flex;flex-direction:column;gap:9px;">
          <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">I want to</span>
          <select name="intent" required style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;transition:border-color .2s;appearance:none;">
            <option value="" style="background:var(--chip);">Choose&hellip;</option>
            <option style="background:var(--chip);">Book a consultation</option>
            <option style="background:var(--chip);">Schedule a demo</option>
            <option style="background:var(--chip);">Discuss a custom solution</option>
            <option style="background:var(--chip);">Something else</option>
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:9px;">
          <span style="font-size:13px;font-weight:600;color:rgba(var(--text),0.82);">What would you like to automate?</span>
          <textarea name="message" rows="3" placeholder="Tell us about your workflows, call volume, or the problem you're solving&hellip;" style="background:rgba(var(--surface),0.65);border:1px solid rgba(var(--border),0.28);border-radius:11px;padding:13px 15px;color:rgba(var(--head),1);font-size:14.5px;resize:vertical;transition:border-color .2s;"></textarea>
        </label>
        <button type="submit" id="artintele-contact-submit" style="cursor:pointer;background:linear-gradient(135deg,#1f9d5b,#36c07e);color:#12231a;font-weight:700;font-size:15px;padding:15px;border:none;border-radius:12px;box-shadow:0 16px 40px -14px rgba(35,150,95,0.55);">Send &amp; Book &rarr;</button>
        <div id="artintele-contact-msg" style="display:none;font-size:14px;text-align:center;padding:13px;border-radius:11px;background:rgba(var(--surface),0.55);border:1px solid rgba(var(--border),0.28);color:rgba(var(--head),1);"></div>
      </form>
    </div>

    <div style="display:flex;gap:34px;flex-wrap:wrap;justify-content:center;margin-top:36px;font-size:14px;color:rgba(var(--text),0.66);">
      <a href="mailto:sales@prachalas.com" style="text-decoration:none;color:rgba(var(--text),0.75);display:flex;align-items:center;gap:9px;"><span style="width:6px;height:6px;border-radius:50%;background:#2bbf7a;box-shadow:0 0 8px rgba(43,191,122,0.7);"></span>sales@prachalas.com</a>
      <span style="display:flex;align-items:center;gap:9px;"><span style="width:6px;height:6px;border-radius:50%;background:#2bbf7a;box-shadow:0 0 8px rgba(43,191,122,0.7);"></span>Replies within one business day</span>
    </div>
  </section>

</div>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/contact.js"></script>
</body>
</html>
