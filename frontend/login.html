<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Artintele Telecaller CRM</title>
<link id="favicon" rel="icon" type="image/png" href="/assets/img/logo-light.png?v=20260701">
<link rel="apple-touch-icon" href="/assets/img/logo-light.png?v=20260701">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css?v=20260701">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem('artintele-theme')==='dark')?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
</head>
<body>
<div data-screen-label="Login" style="position:relative;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
  <div style="position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(110% 80% at 50% 0%, rgba(var(--veil),0) 35%, rgba(var(--veil),0.55) 100%);"></div>

  <div style="position:relative;z-index:5;width:100%;max-width:420px;padding:44px 38px;border-radius:24px;border:1px solid rgba(var(--border),0.24);background:linear-gradient(155deg,rgba(var(--surface),0.92),rgba(var(--surface),0.6));backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px);box-shadow:0 50px 120px -40px rgba(var(--shadow),0.26),inset 0 1px 0 rgba(var(--edge),0.9);text-align:center;">
    <div style="display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:8px;">
      <img class="brand-logo" src="/assets/img/logo-light.png?v=20260701" alt="Artintele" width="30" height="30" style="display:block;flex:none;object-fit:contain;">
      <span style="font-family:'Sora';font-weight:700;font-size:18px;letter-spacing:-0.02em;">artintele<span style="opacity:0.45;">.ai</span></span>
    </div>
    <div style="font-family:'Space Mono';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(var(--label),0.7);margin-bottom:24px;">Telecaller CRM</div>

    <h1 style="font-family:'Sora';font-weight:700;font-size:24px;margin:0 0 10px;letter-spacing:-0.02em;">Sign in to continue</h1>
    <p style="margin:0 0 28px;font-size:14px;line-height:1.55;color:rgba(var(--text),0.66);">This dashboard is restricted. Use your <strong>@prachalas.com</strong> Google Workspace account.</p>

    <div id="error" style="display:none;font-size:13px;text-align:left;padding:12px 14px;border-radius:11px;margin-bottom:18px;background:rgba(214,90,90,0.1);border:1px solid rgba(214,90,90,0.4);color:rgba(var(--head),1);"></div>

    <a id="signin" href="/auth/login" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:1px solid rgba(var(--border),0.32);background:rgba(var(--surface),0.85);color:rgba(var(--head),1);font-weight:600;font-size:15px;box-shadow:0 10px 26px -14px rgba(35,150,95,0.4);">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>

    <p style="margin:22px 0 0;font-size:12px;color:rgba(var(--label),0.7);font-family:'Space Mono';">Accounts outside @prachalas.com are blocked.</p>
    <a href="/" style="display:inline-block;margin-top:18px;font-size:13px;color:rgba(var(--text),0.6);text-decoration:none;">&larr; Back to site</a>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var err = params.get('error');
  if (err) {
    var box = document.getElementById('error');
    box.style.display = 'block';
    box.textContent = err === 'domain'
      ? 'That Google account is not on the @prachalas.com domain. Sign in with your prachalas.com Workspace account.'
      : 'Sign-in could not be completed. Please try again.';
  }
})();
</script>
</body>
</html>
