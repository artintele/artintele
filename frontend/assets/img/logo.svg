<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Artintele">
  <title>Artintele</title>
  <!-- Interim SVG rendition of the Artintele geometric mark (teal interlaced
       rosette). Replace by saving the exact raster as logo.png. -->
  <g fill="none" stroke="#1f5f6e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint construction circle -->
    <circle cx="50" cy="50" r="46" stroke="#1f5f6e" stroke-opacity="0.18" stroke-width="1"/>
    <!-- 12 interlaced petals -->
    <g>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(0 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(30 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(60 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(90 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(120 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(150 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(180 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(210 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(240 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(270 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(300 50 50)"/>
      <path d="M50 50 Q33 29 50 9 Q67 29 50 50 Z" transform="rotate(330 50 50)"/>
    </g>
    <!-- inner ring + central diamond -->
    <circle cx="50" cy="50" r="20"/>
    <rect x="41" y="41" width="18" height="18" rx="2" transform="rotate(45 50 50)"/>
    <circle cx="50" cy="50" r="3.4" fill="#1f5f6e" stroke="none"/>
  </g>
</svg>
