<script>
window.ArtinteleCRM = (function () {
  var STATUSES = [];
  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  // Session expired / not signed in -> back to the Google login page.
  function unauth(r) { if (r.status === 401) { location.href = '/login'; throw new Error('unauth'); } return r.json(); }
  function fmt(iso) { if (!iso) return '—'; var d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function dtLocal(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  function renderStats(stats) {
    var host = document.getElementById('stats');
    var cells = [['Total leads', stats.total], ['Demos', stats.demos]];
    Object.keys(stats.by_status).forEach(function (k) { cells.push([k.replace('_', ' '), stats.by_status[k]]); });
    host.innerHTML = cells.map(function (c) {
      return '<div class="card stat"><div class="num">' + c[1] + '</div><div class="lbl">' + esc(c[0]) + '</div></div>';
    }).join('');
  }

  function statusSelect(id, current) {
    return '<select data-field="status" data-id="' + id + '">' + STATUSES.map(function (s) {
      return '<option value="' + s + '"' + (s === current ? ' selected' : '') + '>' + s.replace('_', ' ') + '</option>';
    }).join('') + '</select>';
  }

  function renderRows(leads) {
    var tb = document.getElementById('rows');
    if (!leads.length) { tb.innerHTML = '<tr><td colspan="10" class="muted" style="padding:24px;">No leads yet. Submit the contact form to see one here.</td></tr>'; return; }
    tb.innerHTML = leads.map(function (l) {
      var demo = /demo/i.test(l.intent || '');
      return '<tr data-id="' + l.id + '">'
        + '<td>' + l.id + '</td>'
        + '<td class="muted">' + fmt(l.created_at) + '</td>'
        + '<td><strong>' + esc(l.name) + '</strong>' + (l.company ? '<div class="muted">' + esc(l.company) + '</div>' : '') + (l.website ? '<div class="muted"><a href="' + esc(l.website) + '" target="_blank" rel="noopener" style="color:#1f9d5b;text-decoration:none;">' + esc(l.website) + '</a></div>' : '') + (l.message ? '<div class="muted" style="max-width:220px;white-space:normal;margin-top:4px;">' + esc(l.message) + '</div>' : '') + '</td>'
        + '<td><a href="mailto:' + esc(l.email) + '" style="color:#1f9d5b;text-decoration:none;">' + esc(l.email) + '</a>' + (l.phone ? '<div><a href="tel:' + esc(l.phone) + '" style="color:rgba(var(--text),0.85);text-decoration:none;">' + esc(l.phone) + '</a></div>' : '') + '</td>'
        + '<td style="min-width:150px;">' + (demo ? '<span class="pill demo-flag">demo</span><div class="muted" style="margin-top:4px;">' + esc(l.intent) + '</div>' : esc(l.intent || '—')) + (l.call_volume ? '<div class="muted" style="margin-top:4px;">Calls/mo: ' + esc(l.call_volume) + '</div>' : '') + (l.services ? '<div class="muted" style="margin-top:4px;max-width:230px;white-space:normal;">Wants: ' + esc(l.services) + '</div>' : '') + (l.lead_source ? '<div class="muted" style="margin-top:4px;">Leads from: ' + esc(l.lead_source) + '</div>' : '') + '</td>'
        + '<td style="min-width:130px;">' + statusSelect(l.id, l.status) + '</td>'
        + '<td style="min-width:120px;"><input data-field="assigned_to" data-id="' + l.id + '" value="' + esc(l.assigned_to) + '" placeholder="caller"></td>'
        + '<td style="min-width:170px;"><input type="datetime-local" data-field="follow_up_at" data-id="' + l.id + '" value="' + dtLocal(l.follow_up_at) + '"></td>'
        + '<td style="min-width:180px;"><textarea data-field="call_notes" data-id="' + l.id + '" placeholder="Call notes…">' + esc(l.call_notes) + '</textarea></td>'
        + '<td><div class="row-actions"><button class="btn sm" onclick="ArtinteleCRM.save(' + l.id + ')">Save</button></div></td>'
        + '</tr>';
    }).join('');
  }

  function collect(id) {
    var out = {};
    document.querySelectorAll('[data-id="' + id + '"]').forEach(function (el) {
      var f = el.getAttribute('data-field');
      if (!f) return;
      var v = el.value;
      if (f === 'follow_up_at') { out[f] = v ? new Date(v).toISOString() : null; }
      else out[f] = v;
    });
    return out;
  }

  function save(id) {
    fetch('/api/admin/leads/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(collect(id))
    }).then(function (r) { if (r.status === 401) { location.href = '/login'; throw new Error('unauth'); } if (!r.ok) throw new Error(); return r.json(); })
      .then(function () { load(); })
      .catch(function (e) { if (e.message !== 'unauth') alert('Could not save lead #' + id); });
  }

  function load() {
    var status = document.getElementById('statusFilter').value || 'all';
    var q = document.getElementById('search').value.trim();
    var url = '/api/admin/leads?status_filter=' + encodeURIComponent(status) + (q ? '&q=' + encodeURIComponent(q) : '');
    Promise.all([
      fetch(url).then(unauth),
      fetch('/api/admin/stats').then(unauth)
    ]).then(function (res) {
      var data = res[0];
      if (!STATUSES.length) {
        STATUSES = data.statuses;
        var sf = document.getElementById('statusFilter');
        sf.innerHTML = '<option value="all">All statuses</option>' + STATUSES.map(function (s) { return '<option value="' + s + '">' + s.replace('_', ' ') + '</option>'; }).join('');
      }
      renderStats(res[1]);
      renderRows(data.leads);
    }).catch(function () {
      document.getElementById('rows').innerHTML = '<tr><td colspan="10" class="muted" style="padding:24px;">Failed to load. Check your login.</td></tr>';
    });
  }

  function whoami() {
    fetch('/api/me').then(function (r) { return r.status === 401 ? null : r.json(); })
      .then(function (d) {
        if (!d || !d.authenticated) { location.href = '/login'; return; }
        var el = document.getElementById('who');
        if (el) el.textContent = d.user.email;
      }).catch(function () {});
  }

  document.addEventListener('DOMContentLoaded', function () {
    whoami();
    document.getElementById('statusFilter').addEventListener('change', load);
    var t; document.getElementById('search').addEventListener('input', function () { clearTimeout(t); t = setTimeout(load, 280); });
    load();
  });

  return { load: load, save: save };
})();
</script>
</body>
</html>
